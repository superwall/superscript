name: Trigger Superscript-iOS Workflow

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  trigger_ios_build:
    runs-on: ubuntu-latest
    steps:
      # Distributes the xcframework as a GitHub Release asset and uses
      # SPM's binaryTarget(url:checksum:) instead of committing the binary.
      # It also publishes the `Superscript` CocoaPod, so it must stay the
      # only iOS repo triggered here.
      - name: Trigger superscript-ios-next Workflow
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.PAT }}
          repository: superwall/superscript-ios-next
          event-type: update-build
